name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # packages/db/src/client.ts only routes through the HTTP proxy when the host says localtest.me.
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5432/goodluck
      # Next inlines this at build time and no .env file reaches CI. The cloud name is public,
      # it sits in every delivery URL; the API key and secret stay out of CI entirely.
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ytkhxohl

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # localtest.me is a public wildcard for 127.0.0.1. Resolving it here keeps CI off outside DNS.
      - run: echo "127.0.0.1 db.localtest.me" | sudo tee -a /etc/hosts

      - run: docker compose up -d --wait
        working-directory: packages/db

      # The proxy has no healthcheck, so --wait returns before it is listening.
      - run: timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/4444) 2>/dev/null; do sleep 1; done'

      # drizzle-kit migrate speaks Neon's websocket protocol, which the local proxy does not serve.
      - run: pnpm db:migrate:dev

      # db:seed:dev reads .env.local, which CI has none of.
      - run: pnpm --filter web exec tsx db/seed/from-content.ts --dev

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
