name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # A Neon branch with content in it, kept for CI.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # Next inlines this at build time and no .env file reaches CI. The cloud name is public,
      # it sits in every delivery URL; the API key and secret stay out of CI entirely.
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ytkhxohl

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @goodluck/db exec drizzle-kit migrate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
