name: CI

on:
  pull_request:

defaults:
  run:
    working-directory: main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: main/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: main/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Builds the Next app on its way to the worker, so there is no separate next build step.
      # Better Auth builds its adapter when its module loads and Next loads every route module
      # during a build. Nothing queries, so a placeholder connection string is enough.
      - run: pnpm build:worker
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - run: pnpm bundle:check
