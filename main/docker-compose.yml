services:
  postgres:
    image: postgres:17-alpine
    # A public page fans out one query per image row and the proxy takes a connection for each,
    # so a seeded database goes past the default 100 during the tests.
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goodluck
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goodluck"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The app only speaks Neon's HTTP protocol. This serves it in front of the local Postgres so
  # local and production run the same driver and the same client code.
  neon-http:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/goodluck
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
